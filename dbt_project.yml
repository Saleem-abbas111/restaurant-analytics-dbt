name: restaurant_analytics
version: '1.0.0'
config-version: 2
profile: restaurant_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  restaurant_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

# dbt adds the custom schema to the target schema by default (e.g. PUBLIC_STAGING).
# The macro in macros/generate_schema_name.sql makes it use exactly STAGING / MARTS.
