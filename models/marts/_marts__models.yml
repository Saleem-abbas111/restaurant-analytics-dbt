version: 2

models:
  - name: fct_daily_sales
    columns:
      - name: daily_sales_key
        tests:
          - unique
          - not_null
      - name: restaurant_id
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
  
  - name: fct_menu_item_performance
    columns:
      - name: menu_item_id
        tests:
          - not_null
      - name: menu_item_name
        tests:
          - not_null
      - name: restaurant_id
        tests:
          - not_null

  - name: fct_inventory
    columns:
      - name: inventory_id
        tests:
          - unique
          - not_null
  - name: fct_restaurant_reviews
    columns:
      - name: restaurant_id
        tests:
          - unique
          - not_null