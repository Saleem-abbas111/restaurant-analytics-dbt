version: 2

models:
  - name: stg_restaurant__address
    columns:
      - name: address_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__city
    columns:
      - name: city_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__country
    columns:
      - name: country_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__customer
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__discount
    columns:
      - name: discount_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__employee
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__employee_shift
    columns:
      - name: employee_shift_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__facility
    columns:
      - name: facility_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__ingredient
    columns:
      - name: ingredient_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__ingredient_category
    columns:
      - name: ingredient_category_id
        tests:
          - unique
          - not_null
