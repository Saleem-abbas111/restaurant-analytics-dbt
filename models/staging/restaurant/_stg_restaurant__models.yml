    columns:
      - name: supplier_category_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__supply_order
    columns:
      - name: supply_order_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__supply_order_item
    columns:
      - name: supply_order_item_id
        tests:
          - unique
          - not_null
  - name: stg_restaurant__dining_table
